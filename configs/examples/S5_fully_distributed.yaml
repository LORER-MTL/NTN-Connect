# ============================================================
# Scenario S5: Fully distributed (network side)
#   - one controller per satellite for HO admission (sat-side)
#   - distributed_satellite mode caps each sat at N users
#   - UEs still passive (v1 design); they pick the sat they're admitted to
# ============================================================

experiment: { name: S5_fully_distributed, random_seed: 42 }

env:
  start_utc: "2026-05-21T12:00:00Z"
  duration_s: 3600
  step_size_s: 60

storage: { data_dir: outputs, run_id: 105 }

operators:
  - id: 1
    name: Kuiper
    sat_id_range: [100000, 199999]
    radio: { carrier_freq_hz: 28.0e9, bandwidth_hz: 400.0e6, power_max_w: 10.0 }
    isl:   { enabled: true, strategy: degree_bounded, max_degree: 4 }
    satellites:
      catalog_id_start: 100000
      generate_tle: true
      shells: [{ altitude_km: 1200, inclination_deg: 87.9, num_planes: 12, num_satellites: 72 }]

users: { num_seed_users: 10, grid_method: random, min_dist_km: 50.0 }

handover:
  mode: distributed_satellite
  satellite_admission_cap: 3
  top_k_local: 5
  min_elevation_deg: 10.0

control_plane:
  arbiter: first_wins
  controllers:
    - id: distributed_sat_admission
      priority: 100
      scope: { operator_ids: [1], node_types: [satellite] }
      visibility: own_node
      decisions: { handover: distributed_satellite }

outputs:
  format: csv                     # CSV for easy distributed-debug inspection
  toggles: { per_user_kpis: true, ho_events: true, active_isl: true, per_operator_kpis: true }
